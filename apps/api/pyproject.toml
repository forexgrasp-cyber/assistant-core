[project]
name = "retention-analytics-api"
version = "0.1.0"
description = "API service for retention analytics platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "celery>=5.4.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "email-validator>=2.1.0",
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
    "pydantic-extra-types>=2.7.0",
    "clickhouse-connect>=0.7.0",
    "sqlmesh>=0.147.0",
    "python-dotenv>=1.0.0",
    "cryptography>=42.0.0",
    "boto3>=1.34.0",
    "stripe>=7.0.0",
    "workos>=2.0.0",
    "sentence-transformers>=3.0.0",
    "chromadb>=0.5.0",
    "openai>=1.30.0",
    "anthropic>=0.25.0",
    "mcp>=1.0.0",
    "fastmcp>=0.1.0",
    "croniter>=2.0.0",
    "retention-analytics-shared-config @ file://../../packages/shared-config",
    "retention-analytics-shared-types @ file://../../packages/shared-types",
    "retention-analytics-reporting-engine @ file://../../packages/reporting-engine",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "faker>=25.0.0",
    "factory-boy>=3.3.0",
    "testcontainers>=4.6.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
shared = { path = "../../../shared-canonical-services", editable = true }
retention-analytics-shared-config = { path = "../../../packages/shared-config", editable = true }
retention-analytics-shared-types = { path = "../../../packages/shared-types", editable = true }
retention-analytics-reporting-engine = { path = "../../../packages/reporting-engine", editable = true }