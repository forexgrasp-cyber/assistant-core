# DEPLOY-ONLY PIPELINE (2026-10-28): the 11 test jobs moved to ci.yml, which
# only runs when a human dispatches it. The suite runs locally before a push;
# this workflow only builds the images and rolls them into the cluster.
# Actions is reserved for deployment.
name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Build and push Web Customer
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web-customer
          push: true
          tags: ghcr.io/${{ github.repository }}/web-customer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Build and push Web Dev
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web-dev
          push: true
          tags: ghcr.io/${{ github.repository }}/web-dev:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Build and push MCP Server
        uses: docker/build-push-action@v5
        with:
          context: ./apps/mcp-server
          push: true
          tags: ghcr.io/${{ github.repository }}/mcp-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

  deploy-staging:
    needs: build-and-push
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/k8s-deploy@v4
        with:
          namespace: staging
          kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}

      - name: Set images
        run: |
          kubectl set image deployment/api api=ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          kubectl set image deployment/web-customer web-customer=ghcr.io/${{ github.repository }}/web-customer:${{ github.sha }}
          kubectl set image deployment/web-dev web-dev=ghcr.io/${{ github.repository }}/web-dev:${{ github.sha }}
          kubectl set image deployment/mcp-server mcp-server=ghcr.io/${{ github.repository }}/mcp-server:${{ github.sha }}
          kubectl rollout status deployment/api
          kubectl rollout status deployment/web-customer
          kubectl rollout status deployment/web-dev
          kubectl rollout status deployment/mcp-server

  deploy-production:
    needs: build-and-push
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/k8s-deploy@v4
        with:
          namespace: production
          kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

      - name: Set images
        run: |
          kubectl set image deployment/api api=ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          kubectl set image deployment/web-customer web-customer=ghcr.io/${{ github.repository }}/web-customer:${{ github.sha }}
          kubectl set image deployment/web-dev web-dev=ghcr.io/${{ github.repository }}/web-dev:${{ github.sha }}
          kubectl set image deployment/mcp-server mcp-server=ghcr.io/${{ github.repository }}/mcp-server:${{ github.sha }}
          kubectl rollout status deployment/api
          kubectl rollout status deployment/web-customer
          kubectl rollout status deployment/web-dev
          kubectl rollout status deployment/mcp-server

  notify:
    needs: [deploy-staging, deploy-production]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify on failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"Pipeline failed: ${{ github.workflow }} - ${{ github.run_id }}"}' \
            ${{ secrets.SLACK_WEBHOOK_URL }}
