name: CI

on:
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: 'latest'

      - name: Install dependencies
        run: |
          cd apps/api
          uv sync --frozen --all-extras

      - name: Run linting
        run: |
          cd apps/api
          uv run ruff check .
          uv run mypy apps/api/app

      - name: Run tests
        run: |
          cd apps/api
          uv run pytest -x -q --cov=apps.api.app --cov-report=xml --cov-fail-under=80

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./apps/api/coverage.xml
          flags: unittests

  lint-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd apps/web-customer && npm ci
          cd ../web-dev && npm ci

      - name: Lint frontend
        run: |
          cd apps/web-customer && npm run lint
          cd ../web-dev && npm run lint

      - name: Type check
        run: |
          cd apps/web-customer && npm run type-check
          cd ../web-dev && npm run type-check

      - name: Build frontend
        run: |
          cd apps/web-customer && npm run build
          cd ../web-dev && npm run build

  test-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          cd apps/api
          uv sync --frozen --all-extras

      - name: Run integration tests
        run: |
          cd apps/api
          uv run pytest tests/integration -x -v --tb=short

  # ========================================================================
  # Additional Test Stages
  # ========================================================================

  test-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          cd apps/api
          uv sync --frozen --all-extras

      - name: Run security scan (bandit + pip-audit)
        run: |
          cd apps/api
          uv run bandit -r . || true
          uv run pip-audit || true

  test-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          cd packages/reporting-engine
          uv sync --frozen --all-extras

      - name: Run performance tests
        run: |
          cd packages/reporting-engine
          uv run pytest tests/ -k "performance" -q --tb=short || true

  test-load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          cd packages/reporting-engine
          uv sync --frozen --all-extras
          uv pip install locust

      - name: Run load tests
        run: |
          cd packages/reporting-engine
          uv run locust -f tests/load_test.py --headless -u 10 -r 2 --run-time 1m --html locust_report.html || true
        env:
          LOCUST_HOST: http://localhost:8765

  test-lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd apps/web-customer
          npm ci

      - name: Run Lighthouse audit
        run: |
          cd apps/web-customer
          npx lighthouse http://localhost:8766 --preset=desktop --output=json --output-path=lighthouse-report.json || true

  test-webhook-sim:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          cd apps/api
          uv sync --frozen --all-extras

      - name: Run webhook simulation tests
        run: |
          cd apps/api
          uv run pytest tests/integration -k "webhook" -q --tb=short || true

  test-e2e-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd apps/web-customer
          npm ci

      - name: Install Playwright browsers
        run: |
          cd apps/web-customer
          npx playwright install --deps chromium

      - name: Run E2E tests
        run: |
          cd apps/web-customer
          npx playwright test || true

  test-cross-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd apps/web-customer
          npm ci

      - name: Install Playwright browsers
        run: |
          cd apps/web-customer
          npx playwright install chromium firefox webkit

      - name: Run cross-platform E2E tests
        run: |
          cd apps/web-customer
          npx playwright test --browser=chromium --browser=firefox --browser=webkit || true

  test-data-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          cd packages/reporting-engine
          uv sync --frozen --all-extras

      - name: Run data validation tests
        run: |
          cd packages/reporting-engine
          uv run pytest tests/ -k "data_validation or schema" -q --tb=short || true

