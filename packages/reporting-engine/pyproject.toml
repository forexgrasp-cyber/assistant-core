[project]
name = "retention-analytics-reporting-engine"
version = "0.1.0"
description = "Dynamic reporting engine built on shared analytics services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    "structlog>=24.1.0",
    "jinja2>=3.1.0",
    "weasyprint>=61.0",
    "playwright>=1.40.0",
    "markdown>=3.6.0",
    "pyyaml>=6.0.1",
    "python-dateutil>=2.9.0",
    "pandas>=2.2.0",
    "plotly>=5.20.0",
    "kaleido>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "faker>=25.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
pdf = [
    "weasyprint>=61.0",
    "playwright>=1.40.0",
]
charts = [
    "plotly>=5.20.0",
    "kaleido>=0.1.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
shared = { path = "../../shared-canonical-services", editable = true }