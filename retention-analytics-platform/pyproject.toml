[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retention-analytics-platform"
version = "0.1.0"
description = "Multi-tenant retention analytics platform: services wired into workflows, pipelines, and frontend"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Ihor Leshchuk"}]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "celery>=5.4.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "email-validator>=2.1.0",
    "structlog>=24.1.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "cryptography>=42.0.0",
    "stripe>=7.0.0",
    "mcp>=1.0.0",
    "fastmcp>=0.1.0",
    "shared-canonical-services @ git+https://github.com/forexgrasp-cyber/shared-canonical-services@v2026.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "faker>=25.0.0",
    "factory-boy>=3.3.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "playwright>=1.40.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "faker>=25.0.0",
    "factory-boy>=3.3.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "playwright>=1.40.0",
]

[tool.uv.sources]
shared-canonical-services = { path = "../shared-canonical-services", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "W", "UP", "B", "C4", "ARG", "PTH", "SIM", "T20", "FLY", "PIE", "TID", "ERA", "PD", "RSE", "RET", "TRY", "NPY", "PERF", "ISC", "ICN", "LOG", "PL", "TRY"]
ignore = ["E501", "B008", "C901"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "B011", "PLR2004"]
"packages/*/tests/*" = ["S101", "S106", "B011", "PLR2004"]
"migrations/*" = ["E501", "I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
mypy_path = ["../shared-canonical-services", "./packages"]

[[tool.mypy.overrides]]
module = "shared.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "retention_analytics_*"
ignore_missing_imports = true

[tool.alembic]
script_location = "apps/api/migrations"
prepend_sys_path = "."
version_path_separator = "os"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "packages/*/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers -m 'not live and not e2e'"
markers = [
    "live: tests that require a real PostgreSQL (run in the deploy/E2E gate only)",
    "e2e: browser journey tests via Playwright (run in the pre-push/deploy gate only)",
    "slow: long-running tests excluded from the fast gate",
]

[tool.coverage.run]
source = ["apps", "packages"]
omit = ["*/tests/*", "*/migrations/*", "*/.venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.setuptools.packages.find]
where = ["packages"]
include = ["retention_analytics_*"]

[tool.setuptools.package-data]
"retention_analytics_templates" = ["templates/*.mjml"]
