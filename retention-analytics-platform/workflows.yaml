# Workflows declaration — retention-analytics-platform
# Required by PRODUCTION_STANDARDS.md §14.2 and §13
# Each workflow must have a proof line (end-to-end test or executed live run).

workflows:
  - name: churn-prevention
    id: churn-prevention
    tenant_id: 00000000-0000-0000-0000-000000000001
    trigger:
      type: event
      event_type: client.churn_risk
    steps:
      - id: compute_churn
        service: analytics.metric
        action: compute_retention
        input: {tenant_id: 00000000-0000-0000-0000-000000000001}
      - id: send_email
        service: email
        action: send
        input: {to: "{{event.client_email}}", subject: "We miss you — come back", body: "Here's 20% off your next month."}
        depends_on: [compute_churn]
      - id: send_sms
        service: sms
        action: send
        input: {to: "{{event.client_phone}}", body: "We miss you! 20% off."}
        depends_on: [compute_churn]
    state_machine: queued → running → completed | failed (persisted per step)
    side_effects:
      - email.send (external)
      - sms.send (external)
    failure_handling:
      retry: 0
      on_error: continue (step continues; run marked failed if halt)
    money_impact: none
    observability: correlation ID from event; structlog step logs
    proof: tests/test_integration.py::test_event_triggers_workflow

  - name: cart-abandonment
    id: cart-abandonment
    tenant_id: 00000000-0000-0000-0000-000000000001
    trigger:
      type: event
      event_type: order.abandoned_cart
    steps:
      - id: recover_cart
        service: ecommerce.core
        action: recover_cart
        input: {cart_id: "{{event.cart_id}}", discount: 0.1}
      - id: send_recovery_email
        service: email
        action: send
        input: {to: "{{event.customer_email}}", subject: "Complete your purchase", body: "You left items in your cart — here's 10% off."}
        depends_on: [recover_cart]
      - id: send_recovery_sms
        service: sms
        action: send
        input: {to: "{{event.customer_phone}}", body: "Complete your cart — 10% off inside."}
        depends_on: [recover_cart]
    state_machine: queued → running → completed | failed (persisted per step)
    side_effects:
      - ecommerce.core.recover_cart (mutation)
      - email.send (external)
      - sms.send (external)
    failure_handling:
      retry: 0
      on_error: continue
    money_impact: recovery offer (discount) — entitlement/fulfillment not yet persisted
    observability: correlation ID from event; structlog step logs
    proof: tests/test_integration.py::test_workflow_invokes_service_actions_as_pipeline_steps

  - name: subscription-win-back
    id: subscription-win-back
    tenant_id: 00000000-0000-0000-0000-000000000001
    trigger:
      type: event
      event_type: subscription.cancelled
    steps:
      - id: dunning
        service: subscriptions
        action: dunning
        input: {subscription_id: "{{event.subscription_id}}", customer_email: "{{event.customer_email}}"}
      - id: send_winback_email
        service: email
        action: send
        input: {to: "{{event.customer_email}}", subject: "We'd love to have you back", body: "Your subscription is paused — reactivate today."}
        depends_on: [dunning]
    state_machine: queued → running → completed | failed (persisted per step)
    side_effects:
      - subscriptions.dunning (mutation)
      - email.send (external)
    failure_handling:
      retry: 0
      on_error: continue
    money_impact: win-back offer — entitlement reactivation not yet persisted
    observability: correlation ID from event; structlog step logs
    proof: tests/test_platform_services.py::test_workflow_proof[subscription-win-back-subscription.cancelled-expected_services0]

