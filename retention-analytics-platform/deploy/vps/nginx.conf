server {
    listen 80;
    server_name retention.snapford.com;

    client_max_body_size 25m;

    # API
    location /api/ {
        proxy_pass http://api:47319;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /health { proxy_pass http://api:47319; include proxy_params; }
    location = /health/ { proxy_pass http://api:47319; include proxy_params; }
    location = /health/ready { proxy_pass http://api:47319; include proxy_params; }
    location = /health/live { proxy_pass http://api:47319; include proxy_params; }
    location = /metrics { proxy_pass http://api:47319; include proxy_params; }
    location = /robots.txt { proxy_pass http://api:47319; include proxy_params; }
    location = /sitemap.xml { proxy_pass http://api:47319; include proxy_params; }
    location = /llms.txt { proxy_pass http://api:47319; include proxy_params; }

    # API docs
    location /docs { proxy_pass http://api:47319; include proxy_params; }
    location /openapi.json { proxy_pass http://api:47319; include proxy_params; }
    location /redoc { proxy_pass http://api:47319; include proxy_params; }

    # Customer portal (SPA)
    location / {
        proxy_pass http://portal:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
