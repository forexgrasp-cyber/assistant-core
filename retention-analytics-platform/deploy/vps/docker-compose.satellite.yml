# Satellite stack for the shared Traefik edge (ip-lookup-proxy-1, network `web`).
# Traefik owns 80/443; this stack publishes NOTHING on the host.
#   docker compose -f deploy/vps/docker-compose.satellite.yml up -d --build
# Required .env keys: TRAEFIK_HOST, POSTGRES_PASSWORD, REDIS_PASSWORD,
# JWT_SECRET, WEBHOOK_SECRET, PII_ENCRYPTION_KEY
#
# PROJECT_PATH is the project directory relative to the build CONTEXT. It
# defaults to the flat layout (project at the clone root); a clone that keeps
# the project one level down (a monorepo mirror) sets it in .env.
services:
  api:
    image: retention-analytics-platform:latest
    build:
      context: /opt/sites
      dockerfile: ${PROJECT_PATH:-retention-analytics-platform}/infra/docker/Dockerfile.api
      args:
        PROJECT: ${PROJECT_PATH:-retention-analytics-platform}
    restart: unless-stopped
    env_file: [.env]
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-retention_analytics}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      APP_SECRET_KEY: ${JWT_SECRET:?JWT_SECRET required}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?WEBHOOK_SECRET required}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:?PII_ENCRYPTION_KEY required}
      DATA_DIR: /data
      PUBLIC_API_URL: https://${TRAEFIK_HOST:?TRAEFIK_HOST required}/api/v1
    volumes:
      - retention_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [web, internal]
    labels:
      - traefik.enable=true
      # API router with path-specific rules (higher priority so it matches first)
      - traefik.http.routers.retention-api.rule=Host(`${TRAEFIK_HOST:?set TRAEFIK_HOST in .env}`) && (PathPrefix(`/api`) || Path(`/health`) || Path(`/health/`) || Path(`/health/ready`) || Path(`/metrics`) || Path(`/robots.txt`) || Path(`/sitemap.xml`) || Path(`/llms.txt`) || Path(`/docs`) || Path(`/openapi.json`) || Path(`/redoc`))
      - traefik.http.routers.retention-api.entrypoints=websecure
      - traefik.http.routers.retention-api.tls.certresolver=le
      - traefik.http.routers.retention-api.priority=100
      - traefik.http.services.retention-api.loadbalancer.server.port=47319
      # Insecure redirect for API paths
      - traefik.http.routers.retention-api-insecure.rule=Host(`${TRAEFIK_HOST}`) && (PathPrefix(`/api`) || Path(`/health`) || Path(`/health/`) || Path(`/health/ready`) || Path(`/metrics`) || Path(`/robots.txt`) || Path(`/sitemap.xml`) || Path(`/llms.txt`) || Path(`/docs`) || Path(`/openapi.json`) || Path(`/redoc`))
      - traefik.http.routers.retention-api-insecure.entrypoints=web
      - traefik.http.routers.retention-api-insecure.middlewares=redirect
      - traefik.http.routers.retention-api-insecure.priority=100

  portal:
    image: retention-analytics-platform:portal
    restart: unless-stopped
    env_file: [.env]
    environment:
      ENVIRONMENT: production
      API_BACKEND_URL: http://api:47319
      NEXT_PUBLIC_API_URL: https://${TRAEFIK_HOST:?TRAEFIK_HOST required}/api/v1
    depends_on:
      api:
        condition: service_started
    networks: [web, internal]
    labels:
      - traefik.enable=true
      - traefik.http.routers.retention-portal.rule=Host(`${TRAEFIK_HOST:?set TRAEFIK_HOST in .env}`)
      - traefik.http.routers.retention-portal.entrypoints=websecure
      - traefik.http.routers.retention-portal.tls.certresolver=le
      - traefik.http.services.retention-portal.loadbalancer.server.port=47320
      - traefik.http.routers.retention-portal-insecure.rule=Host(`${TRAEFIK_HOST}`)
      - traefik.http.routers.retention-portal-insecure.entrypoints=web
      - traefik.http.routers.retention-portal-insecure.middlewares=redirect
      # Dedicated high-priority router for root path only
      - traefik.http.routers.retention-portal-root.rule=Host(`${TRAEFIK_HOST:?set TRAEFIK_HOST in .env}`) && Path(`/`)
      - traefik.http.routers.retention-portal-root.priority=200
      - traefik.http.routers.retention-portal-root.service=retention-portal
      - traefik.http.routers.retention-portal-root.entrypoints=websecure
      - traefik.http.routers.retention-portal-root.tls.certresolver=le

  workers:
    image: retention-analytics-platform:latest
    restart: unless-stopped
    env_file: [.env]
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-retention_analytics}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      JWT_SECRET: ${JWT_SECRET}
      APP_SECRET_KEY: ${JWT_SECRET}
      DATA_DIR: /data
    volumes:
      - retention_data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks: [internal]
    command: ["celery", "-A", "apps.workers.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    # The image HEALTHCHECK probes uvicorn :47319 - celery serves no HTTP, so
    # worker liveness = broker ping answered by THIS node.
    #
    # The ping is sent through a bare Celery app, NOT `celery -A
    # apps.workers.celery_app inspect ping`: that form imports the whole
    # platform (107 services registered at import time) and took minutes per
    # probe on a loaded 2-core box, so it always exceeded the timeout and
    # marked a perfectly healthy worker unhealthy. A bare Celery app talks to
    # the broker directly and answers in a second or two.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os,socket;from celery import Celery;a=Celery(broker=os.environ['CELERY_BROKER_URL']);r=a.control.ping(destination=['celery@'+socket.gethostname()],timeout=5);raise SystemExit(0 if r else 1)"
      interval: 60s
      timeout: 60s
      retries: 3
      start_period: 60s

  beat:
    image: retention-analytics-platform:latest
    restart: unless-stopped
    env_file: [.env]
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-retention_analytics}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      JWT_SECRET: ${JWT_SECRET}
      APP_SECRET_KEY: ${JWT_SECRET}
      DATA_DIR: /data
    volumes:
      - retention_data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks: [internal]
    command: ["celery", "-A", "apps.workers.celery_app", "beat", "--loglevel=info"]
    # Beat answers no inspect ping (workers only) - liveness = PID 1 is the
    # beat process.
    healthcheck:
      test: ["CMD-SHELL", "tr '\\0' ' ' < /proc/1/cmdline | grep -q 'celery -A apps.workers.celery_app beat'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-retention_analytics}
    volumes:
      - retention_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-retention_analytics}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - retention_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [internal]

volumes:
  retention_data:
  retention_pg:
  retention_redis:

networks:
  web:
    external: true
  internal:
