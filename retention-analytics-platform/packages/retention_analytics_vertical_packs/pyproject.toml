[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retention-analytics-vertical-packs"
version = "0.1.0"
description = "Pluggable vertical packs (marketing, ecommerce, saas, fintech, healthcare) with domain workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "retention-analytics-core",
    "retention-analytics-shared-types",
]

[tool.setuptools]
package-dir = { "retention_analytics_vertical_packs" = "." }
packages = ["retention_analytics_vertical_packs", "retention_analytics_vertical_packs.ecommerce", "retention_analytics_vertical_packs.fintech", "retention_analytics_vertical_packs.healthcare", "retention_analytics_vertical_packs.marketing", "retention_analytics_vertical_packs.saas"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
