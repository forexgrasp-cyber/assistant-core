[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retention-analytics-engagement"
version = "0.1.0"
description = "Engagement services (email, sms, push, flows, templates, deliverability) wired into workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "redis>=5.0.0",
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
    "httpx>=0.27.0",
    "retention-analytics-shared-config",
    "retention-analytics-shared-types",
    "retention-analytics-core",
]

[tool.setuptools]
package-dir = { "retention_analytics_engagement" = "." }
packages = ["retention_analytics_engagement", "retention_analytics_engagement.email", "retention_analytics_engagement.flows", "retention_analytics_engagement.push", "retention_analytics_engagement.sms"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
