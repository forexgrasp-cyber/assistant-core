[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retention-analytics-ecommerce"
version = "0.1.0"
description = "Ecommerce services (subscriptions, products, orders) wired into workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "stripe>=7.0.0",
    "structlog>=24.1.0",
    "retention-analytics-shared-config",
    "retention-analytics-shared-types",
    "retention-analytics-core",
]

[tool.setuptools]
package-dir = { "retention_analytics_ecommerce" = "." }
packages = ["retention_analytics_ecommerce", "retention_analytics_ecommerce.core", "retention_analytics_ecommerce.subscriptions"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
