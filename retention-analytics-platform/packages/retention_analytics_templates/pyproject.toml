[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retention-analytics-templates"
version = "0.1.0"
description = "MJML email templates rendered by workflows before sending"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "jinja2>=3.1.0",
    "retention-analytics-core",
    "retention-analytics-shared-config",
]

[tool.setuptools]
package-dir = { "retention_analytics_templates" = "." }
packages = ["retention_analytics_templates"]

[tool.setuptools.package-data]
retention_analytics_templates = ["templates/*.mjml"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
