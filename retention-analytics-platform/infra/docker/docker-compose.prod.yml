services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - web-customer
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-retention_analytics}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  api:
    image: ghcr.io/${GITHUB_REPOSITORY:-local}/api:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:47323/${POSTGRES_DB:-retention_analytics}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:47324/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:47324/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:47324/2
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required in production}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?WEBHOOK_SECRET required}
      RATE_LIMIT_STORAGE_URL: redis://:${REDIS_PASSWORD}@redis:47324/3
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1"
          memory: 1G

  workers:
    image: ghcr.io/${GITHUB_REPOSITORY:-local}/api:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:47323/${POSTGRES_DB:-retention_analytics}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:47324/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:47324/2
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1"
          memory: 512M

  web-customer:
    image: ghcr.io/${GITHUB_REPOSITORY:-local}/web:${IMAGE_TAG:-latest}
    build:
      context: ../../apps/web-customer
      dockerfile: Dockerfile.web
    environment:
      API_BACKEND_URL: http://api:47319
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:47319/api/v1}
    depends_on:
      - api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  web-dev:
    image: ghcr.io/${GITHUB_REPOSITORY:-local}/web:${IMAGE_TAG:-latest}
    build:
      context: ../../apps/web-dev
      dockerfile: Dockerfile.web
    environment:
      API_BACKEND_URL: http://api:47319
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:47319/api/v1}
    depends_on:
      - api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  mcp-server:
    image: ghcr.io/${GITHUB_REPOSITORY:-local}/api:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.mcp
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:47323/${POSTGRES_DB:-retention_analytics}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  postgres_prod_data:
  redis_prod_data:
