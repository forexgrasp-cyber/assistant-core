services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: retention_analytics
    ports:
      - "47323:47323"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "47324:47324"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "47325:47325"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:47325/ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
    ports:
      - "47319:47319"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:47323/retention_analytics
      REDIS_URL: redis://redis:47324/0
      CELERY_BROKER_URL: redis://redis:47324/1
      CELERY_RESULT_BACKEND: redis://redis:47324/2
      CLICKHOUSE_HOST: clickhouse
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    command: uv run uvicorn apps.api.main:app --host 0.0.0.0 --port 47319 --reload

  workers:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:47323/retention_analytics
      REDIS_URL: redis://redis:47324/0
      CELERY_BROKER_URL: redis://redis:47324/1
      CELERY_RESULT_BACKEND: redis://redis:47324/2
    depends_on:
      - redis
    command: celery -A apps.workers.celery_app worker --loglevel=info

  mcp-server:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.mcp
    ports:
      - "47322:47322"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:47323/retention_analytics
    depends_on:
      - api
    command: uv run python -m mcp_server.main

  web-customer:
    build:
      context: ../../apps/web-customer
      dockerfile: Dockerfile.web
    ports:
      - "47320:47320"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:47319/api/v1
      API_BACKEND_URL: http://api:47319
    depends_on:
      - api

  web-dev:
    build:
      context: ../../apps/web-dev
      dockerfile: Dockerfile.web
    ports:
      - "47321:47321"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:47319/api/v1
      API_BACKEND_URL: http://api:47319
    depends_on:
      - api

volumes:
  postgres_data:
  clickhouse_data:
