services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: retention_analytics
    ports:
      - "47323:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d retention_analytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/library/redis:7-alpine
    ports:
      - "47324:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    image: retention-analytics-platform:api
    ports:
      - "47319:47319"
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/retention_analytics
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      JWT_SECRET: local-dev-jwt-secret-not-for-production
      WEBHOOK_SECRET: local-dev-webhook-secret
      DATA_DIR: /data
    volumes:
      - appdata:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 47319

  workers:
    image: retention-analytics-platform:api
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/retention_analytics
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      JWT_SECRET: local-dev-jwt-secret-not-for-production
      DATA_DIR: /data
    volumes:
      - appdata:/data
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A apps.workers.celery_app worker --loglevel=info --concurrency=2

  web-customer:
    build:
      context: ../../apps/web-customer
      dockerfile: ../../infra/docker/Dockerfile.web
    image: retention-analytics-platform:portal
    ports:
      - "47320:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:47319/api/v1
      API_BACKEND_URL: http://api:47319
    depends_on:
      - api

volumes:
  postgres_data:
  appdata:
