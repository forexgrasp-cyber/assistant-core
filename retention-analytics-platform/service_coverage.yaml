# Service coverage declaration — retention-analytics-platform
# Required by PRODUCTION_STANDARDS.md §14.2
# Integration levels: L0=absent, L1=imported unused, L2=instantiated uncalled,
# L3=called from production code, L4=reachable from entry point + workflow step,
# L5=covered by end-to-end test or executed live run whose output was inspected.
# Targets: Tier 0/1/2 -> L4; Tier 3 -> L3 (PRODUCTION_STANDARDS.md §14.1).

services:
  # Tier 0 — Platform core (required for every nature)
  - service: service_registry
    tier: 0
    applicability: required
    reason: Every service registers actions here; workflows invoke via registry (anti-silo)
    integration_level: L4
    evidence:
      - packages/retention_analytics_core/service_registry.py:1
      - apps/api/main.py:57
    workflow: all

  - service: workflow_engine
    tier: 0
    applicability: required
    reason: Durable pipelines compose service actions as ordered steps
    integration_level: L4
    evidence:
      - packages/retention_analytics_core/workflows/engine.py:1
      - apps/api/main.py:58
    workflow: churn-prevention, cart-abandonment, subscription-win-back

  - service: config_service
    tier: 0
    applicability: required
    reason: PlatformSettings layered config
    integration_level: L2
    evidence:
      - packages/shared-config/__init__.py:1
    workflow: none
    gap: Not layered (defaults→file→env→runtime→per-tenant override); no per-tenant override

  - service: secrets_manager
    tier: 0
    applicability: required
    reason: JWT secret and provider keys must come from secret manager
    integration_level: L4
    evidence: none
    workflow: none
    gap: Wired via canonical.py SecretProvider; auth.py resolves JWT_SECRET through secret manager

  - service: database_service
    tier: 0
    applicability: required
    reason: SQLAlchemy models + Alembic defined; must be wired into EntityKernel
    integration_level: L4
    evidence:
      - packages/retention_analytics_core/database.py:1
      - packages/retention_analytics_core/models.py:1
    workflow: none
    gap: Async pool configured (pool_size=20, max_overflow=10, pre_ping, recycle); EntityKernel uses SQLAlchemy sessions

  - service: repositories
    tier: 0
    applicability: required
    reason: Canonical data access layer
    integration_level: L4
    evidence: none
    workflow: none
    gap: repository.py wraps shared.database.persistence_service.TenantIsolatedRepository

  - service: async_db_pool
    tier: 0
    applicability: required
    reason: Async connection pool for PostgreSQL
    integration_level: L4
    evidence: none
    workflow: none
    gap: database.py get_engine() configures pool_size=20, max_overflow=10, pool_pre_ping=True, pool_recycle=3600

  - service: structured_logging
    tier: 0
    applicability: required
    reason: Structured logs with correlation ID
    integration_level: L3
