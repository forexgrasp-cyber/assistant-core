name: CI / Pre-push Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff check
        run: |
          ruff check packages/ apps/ tests/ scripts/ tests/e2e/

  import-smoke:
    name: Import smoke test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e .
      - name: Run import smoke
        run: python scripts/import_smoke.py

  tests:
    name: Test suite
    runs-on: ubuntu-latest
    needs: import-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: Run tests
        run: pytest tests/ -q --tb=short

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: Run security scan
        run: python scripts/security_scan.py

  schema-drift:
    name: Schema drift gate
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: Run schema drift gate
        run: python scripts/schema_drift_gate.py

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          load: true
          tags: retention-analytics-api:test

  e2e:
    name: E2E browser journeys
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: browser-actions/setup-chrome@v1
      - name: Install dependencies
        run: pip install -e .[dev] && playwright install chromium
      - name: Start API (in-memory mode)
        run: |
          DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/retention_analytics \
          uv run uvicorn apps.api.main:app --host 127.0.0.1 --port 8765 &
        shell: bash
      - name: Run E2E tests
        run: pytest tests/e2e/ -m e2e -q --tb=short
