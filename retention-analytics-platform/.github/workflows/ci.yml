name: CI / Pre-push Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff check
        run: |
          ruff check packages/ apps/ tests/ scripts/ tests/e2e/

  import-smoke:
    name: Import smoke test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e .
      - name: Run import smoke
        run: python scripts/import_smoke.py

  tests:
    name: Test suite
    runs-on: ubuntu-latest
    needs: import-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: Run tests
        run: pytest tests/ -q --tb=short

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: Run security scan
        run: python scripts/security_scan.py

  schema-drift:
    name: Schema drift gate
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: Run schema drift gate
        run: python scripts/schema_drift_gate.py

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          load: true
          tags: retention-analytics-api:test

  backup-drill:
    name: Backup & restore drill
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: Run backup/restore drill
        run: python scripts/backup_restore_drill.py

  load-test:
    name: Load test (locust smoke)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e .[dev] locust
      - name: Start API
        run: |
          DATABASE_URL=sqlite+aiosqlite:///./test_load.db \
          uv run uvicorn apps.api.main:app --host 127.0.0.1 --port 47319 &
        shell: bash
      - name: Wait for API
        run: |
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:47319/health && break; sleep 1; done
        shell: bash
      - name: Run locust smoke test
        run: locust -f tests/load/locustfile.py --headless -u 10 -r 2 -t 10s --host http://127.0.0.1:47319 || true

  e2e:
    name: E2E browser journeys
    runs-on: ubuntu-latest
    needs: docker-build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: retention_analytics
        ports:
          - 47323:47323
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: browser-actions/setup-chrome@v1
      - name: Install dependencies
        run: pip install -e .[dev] && playwright install chromium
      - name: Start API
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:47323/retention_analytics
        run: |
          uv run uvicorn apps.api.main:app --host 127.0.0.1 --port 47319 &
        shell: bash
      - name: Wait for API
        run: |
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:47319/health && break; sleep 1; done
        shell: bash
      - name: Run E2E tests
        run: pytest tests/e2e/ -m e2e -q --tb=short

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [tests, security-scan, backup-drill, docker-build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
            ghcr.io/${{ github.repository }}/api:${{ github.ref == 'refs/heads/main' && 'latest' || 'staging' }}
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web-customer
          file: infra/docker/Dockerfile.web
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web:${{ github.sha }}
            ghcr.io/${{ github.repository }}/web:${{ github.ref == 'refs/heads/main' && 'latest' || 'staging' }}
      - name: Deploy to environment
        run: |
          echo "Deploying ${{ github.sha }} to ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}"
          echo "Images pushed to ghcr.io/${{ github.repository }}/"
          echo "Trigger deployment via your orchestrator (ECS/K8s/SSH) pointing at these image tags."
