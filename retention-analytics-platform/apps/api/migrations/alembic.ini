[alembic]
# path to migration scripts
script_location = apps/api/migrations

# timezone to use when running the date
# preprocessor
# timezone = utc

# the version location
# version_locations = %(here)s/../migrations/versions

# the template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# version code type
# version_code_type = hex

# max length of version code
# version_code_size = 32

# version path separator
version_path_separator = os

# the string used to output the version in the script
# version output

# output encoding
# output_encoding = utf-8

sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:47323/retention_analytics


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run on newly
# generated migration scripts. See the documentation for further detail and
# examples

# format using "black" - use the console
# script runner
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

# logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
