version: '3.8'

# Optimized Docker Compose for Production Deployment
# Implements: Reserved API baseline, Spot worker fleet, Right-sized DB/Cache, SQS/SNS

services:
  # ============================================================
  # API SERVICES (Reserved Instances Baseline)
  # ============================================================
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: retention-analytics/api:latest
    deploy:
      replicas: 2  # Reserved baseline
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      placement:
        constraints:
          - node.role == manager  # Run on reserved instances
    environment:
      - ENV=production
      - WORKERS=4
      - UVICORN_WORKERS=4
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASS}@db-primary:5432/retention
      - REDIS_URL=redis://cache-primary:6379/0
      - SQS_QUEUE_URL=https://sqs.us-east-1.amazonaws.com/${AWS_ACCOUNT_ID}/workflow-jobs
      - SNS_TOPIC_ARN=arn:aws:sns:us-east-1:${AWS_ACCOUNT_ID}:workflow-events
      - PII_ENCRYPTION_KEY=${PII_ENCRYPTION_KEY}
      - SENTRY_DSN=${SENTRY_DSN}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - retention-network
    depends_on:
      db-primary:
        condition: service_healthy
      cache-primary:
        condition: service_healthy

  # ============================================================
  # WORKER SERVICES (Spot Instance Fleet)
  # ============================================================
  worker:
    build:
      context: .
      dockerfile: apps/workers/Dockerfile
    image: retention-analytics/worker:latest
    deploy:
      replicas: 8  # Spot fleet target
      resources:
        limits:
          cpus: '8'
          memory: 16G
        reservations:
          cpus: '4'
          memory: 8G
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      placement:
        constraints:
          - node.labels.worker-type == spot  # Run on spot instances
    environment:
      - ENV=production
      - CELERY_BROKER_URL=sqs://${AWS_ACCESS_KEY_ID}:${AWS_SECRET_ACCESS_KEY}@sqs.us-east-1.amazonaws.com/${AWS_ACCOUNT_ID}/worker-jobs
      - CELERY_RESULT_BACKEND=redis://cache-primary:6379/1
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASS}@db-primary:5432/retention
      - SQS_QUEUE_URL=https://sqs.us-east-1.amazonaws.com/${AWS_ACCOUNT_ID}/worker-jobs
      - SNS_TOPIC_ARN=arn:aws:sns:us-east-1:${AWS_ACCOUNT_ID}:worker-events
    networks:
      - retention-network
    depends_on:
      db-primary:
        condition: service_healthy
      cache-primary:
        condition: service_healthy
    # Spot instance interruption handling
    stop_grace_period: 120s  # Allow 2 min for graceful shutdown on spot interruption

  worker-on-demand:
    build:
      context: .
      dockerfile: apps/workers/Dockerfile
    image: retention-analytics/worker:latest
    deploy:
      replicas: 2  # On-demand baseline for spot interruption buffer
      resources:
        limits:
          cpus: '8'
          memory: 16G
        reservations:
          cpus: '4'
          memory: 8G
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      placement:
        constraints:
          - node.labels.worker-type == on-demand
    environment:
      - ENV=production
      - CELERY_BROKER_URL=sqs://${AWS_ACCESS_KEY_ID}:${AWS_SECRET_ACCESS_KEY}@sqs.us-east-1.amazonaws.com/${AWS_ACCOUNT_ID}/worker-jobs
      - CELERY_RESULT_BACKEND=redis://cache-primary:6379/1
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASS}@db-primary:5432/retention
    networks:
      - retention-network
    depends_on:
      db-primary:
        condition: service_healthy
      cache-primary:
        condition: service_healthy

  # ============================================================
  # MCP SERVER
  # ============================================================
  mcp-server:
    build:
      context: .
      dockerfile: apps/mcp_server/Dockerfile
    image: retention-analytics/mcp:latest
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    environment:
      - ENV=production
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASS}@db-primary:5432/retention
      - REDIS_URL=redis://cache-primary:6379/2
    ports:
      - "8001:8000"
    networks:
      - retention-network
    depends_on:
      db-primary:
        condition: service_healthy
      cache-primary:
        condition: service_healthy

  # ============================================================
  # DATABASE (Right-Sized Primary + Auto-Scaling Read Replica)
  # ============================================================
  db-primary:
    image: postgres:16-alpine
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 32G
        reservations:
          cpus: '2'
          memory: 16G
    environment:
      - POSTGRES_DB=retention
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - db-primary-data:/var/lib/postgresql/data
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=8GB
      -c effective_cache_size=24GB
      -c work_mem=64MB
      -c maintenance_work_mem=2GB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=64MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d retention"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - retention-network

  db-replica:
    image: postgres:16-alpine
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 16G
        reservations:
          cpus: '1'
          memory: 8G
    environment:
      - POSTGRES_DB=retention
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - db-replica-data:/var/lib/postgresql/data
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=4GB
      -c effective_cache_size=12GB
      -c hot_standby=on
      -c max_standby_streaming_delay=30s
      -c wal_receiver_status_interval=10s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d retention"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - retention-network
    depends_on:
      db-primary:
        condition: service_healthy

  # ============================================================
  # CACHE (Redis Cluster Mode)
  # ============================================================
  cache-primary:
    image: redis:7-alpine
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 13G
        reservations:
          cpus: '1'
          memory: 6G
    command: >
      redis-server
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --appendfsync everysec
      --maxmemory 10gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - cache-primary-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - retention-network

  cache-replica-1:
    image: redis:7-alpine
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 13G
        reservations:
          cpus: '1'
          memory: 6G
    command: >
      redis-server
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --appendfsync everysec
      --replicaof cache-primary 6379
    volumes:
      - cache-replica-1-data:/data
    networks:
      - retention-network
    depends_on:
      cache-primary:
        condition: service_healthy

  cache-replica-2:
    image: redis:7-alpine
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 13G
        reservations:
          cpus: '1'
          memory: 6G
    command: >
      redis-server
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --appendfsync everysec
      --replicaof cache-primary 6379
    volumes:
      - cache-replica-2-data:/data
    networks:
      - retention-network
    depends_on:
      cache-primary:
        condition: service_healthy

  # ============================================================
  # MONITORING (CloudWatch Native + Minimal Prometheus)
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.48.0
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'  # Reduced from 30d
      - '--storage.tsdb.retention.size=10GB'
      - '--web.enable-lifecycle'
      - '--enable-feature=remote-write-receiver'
    volumes:
      - ./monitoring/prometheus.optimized.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - retention-network

  grafana:
    image: grafana/grafana:10.2.0
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - retention-network
    depends_on:
      - prometheus

  # ============================================================
  # LOAD BALANCER (CloudFront + ALB in production)
  # ============================================================
  nginx:
    image: nginx:alpine
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.optimized.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - retention-network
    depends_on:
      - api

networks:
  retention-network:
    driver: overlay
    attachable: true

volumes:
  db-primary-data:
  db-replica-data:
  cache-primary-data:
  cache-replica-1-data:
  cache-replica-2-data:
  prometheus-data:
  grafana-data: