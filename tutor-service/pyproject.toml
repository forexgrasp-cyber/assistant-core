[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tutor-service"
version = "2026.11.4"
description = "Language Tutor Service - Award-winning frontend with full verbal/written communication"
readme = "README.md"
requires-python = ">=3.11"
# The runtime dependency set lives in requirements.txt - it is the single
# source of truth for the production image (Dockerfile.prod). It is kept
# aligned with shared-canonical-services==2026.11.4 on purpose: both are
# installed into the same environment.
#
# `shared-canonical-services` is a PRIVATE wheel (not on PyPI). It is
# staged into wheels/ by the deploy script and installed by the
# Dockerfile, so it is NOT listed as a dependency here.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PTH", "T20", "SIM", "RET", "ARG", "PIC", "RUF", "TRY"]
ignore = ["S101", "PTH123", "T201", "RUF012"]
fix = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
