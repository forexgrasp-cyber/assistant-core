version: '3.8'

services:
  # =============================================================================
  # DATABASES
  # =============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: languages_postgres
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: postgres
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: languages_redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # =============================================================================
  # TUTOR SERVICE ONLY
  # =============================================================================
  tutor-service:
    build:
      context: ../tutor-service
      dockerfile: Dockerfile.prod
    container_name: tutor_service
    environment:
      - DATABASE_URL=postgresql+asyncpg://tutor_user:${TUTOR_DB_PASSWORD}@postgres:5432/tutor_service
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - PYTHONUNBUFFERED=1
    env_file:
      - ../tutor-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # =============================================================================
  # REVERSE PROXY & SSL
  # =============================================================================
  nginx:
    image: nginx:alpine
    container_name: languages_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.languages.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - tutor-service
    networks:
      - backend
      - frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  certbot:
    image: certbot/certbot:latest
    container_name: languages_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"
    networks:
      - frontend
    restart: unless-stopped

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

secrets:
  postgres_password:
    file: .postgres_password