version: "3.8"

# ============================================================================
# AI Assistant — one deployment, every agent product.
#
# The shared canonical services library is installed from the PRIVATE wheel
# staged in ./dist/ by deploy.sh (see install_shared_wheel.ps1 for local use).
# Nothing is pulled from a public package index.
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # Application
  # --------------------------------------------------------------------------
  ai-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-assistant
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://ai_assistant:${POSTGRES_PASSWORD}@postgres:5432/ai_assistant
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - PLATFORM_DATA_DIR=/app/data

      # LLM Configuration (free tier by default)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-gpt-4-turbo-preview}

      # Free LLM Providers
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
      - COHERE_API_KEY=${COHERE_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - CLOUDFLARE_API_KEY=${CLOUDFLARE_API_KEY:-}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY:-}

      # Voice / TTS
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}

      # Telephony
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
      - PLIVO_AUTH_ID=${PLIVO_AUTH_ID:-}
      - PLIVO_AUTH_TOKEN=${PLIVO_AUTH_TOKEN:-}
      - SIGNALWIRE_PROJECT_ID=${SIGNALWIRE_PROJECT_ID:-}
      - SIGNALWIRE_TOKEN=${SIGNALWIRE_TOKEN:-}
      - SIGNALWIRE_SPACE=${SIGNALWIRE_SPACE:-}

      # Email (conversation export / share)
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@ai-assistant.com}

      # Encryption keys
      - PII_ENCRYPTION_KEY=${PII_ENCRYPTION_KEY}
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY}

      # CORS
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    volumes:
      - ai_assistant_data:/app/data
      - ai_assistant_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # --------------------------------------------------------------------------
  # PostgreSQL
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ai_assistant_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ai_assistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ai_assistant
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_assistant -d ai_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_net
    deploy:
      resources:
        limits:
          memory: 1G

  # --------------------------------------------------------------------------
  # Redis
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ai_assistant_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_net
    deploy:
      resources:
        limits:
          memory: 384M

  # --------------------------------------------------------------------------
  # Nginx (reverse proxy + TLS)
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: ai_assistant_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    depends_on:
      - ai-assistant
    networks:
      - ai_net

  # --------------------------------------------------------------------------
  # Certbot (TLS certificates)
  # --------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: ai_assistant_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;"

# ============================================================================
networks:
  ai_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ai_assistant_data:
  ai_assistant_logs:
  certbot_www:
  certbot_conf:
