version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: retention-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retention}
      POSTGRES_USER: ${POSTGRES_USER:-retention}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retention} -d ${POSTGRES_DB:-retention}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - retention-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: retention-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - retention-network
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: retention-api
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-retention}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-retention}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - retention-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  web-customer:
    build:
      context: .
      dockerfile: apps/web-customer/Dockerfile
    container_name: retention-web-customer
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
      - NEXT_PUBLIC_WS_URL=ws://api:8000
      - NODE_ENV=production
    depends_on:
      - api
    networks:
      - retention-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  web-dev:
    build:
      context: .
      dockerfile: apps/web-dev/Dockerfile
    container_name: retention-web-dev
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
      - NODE_ENV=production
    depends_on:
      - api
    networks:
      - retention-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: retention-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web-customer
      - web-dev
      - api
    networks:
      - retention-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: retention-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - retention-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.1.0
    container_name: retention-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - retention-network
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.0
    container_name: retention-loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - retention-network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.0
    container_name: retention-promtail
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - retention-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  retention-network:
    driver: bridge