[project]
name = "assistant-core"
version = "0.1.0"
description = "Unified AI Assistant Core - Personal (JARVIS) + Business (Receptionist) modes"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pydantic-yaml>=0.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "stripe>=7.8",
    "twilio>=8.10",
    "httpx>=0.26",
    "structlog>=24.1",
    "chromadb>=0.5",
    "sentence-transformers>=2.2",
    "pyaudio>=0.2.14",
    "webrtcvad>=2.0",
    "pillow>=10.0",
    "pystray>=0.19",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "apscheduler>=3.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.optional-dependencies]
desktop = ["pystray>=0.19", "pillow>=10.0"]
voice = ["pyaudio>=0.2.14", "webrtcvad>=2.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]