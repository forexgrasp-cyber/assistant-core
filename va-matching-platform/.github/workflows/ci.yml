name: VA Matching Platform CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  # Test database
  VA_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/va_matching_test
  # Shared canonical services (sibling repo cloned below)
  SHARED_SERVICES_PATH: ../shared-canonical-services

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: va_matching_test
        ports:
          5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout VA Matching Platform
        uses: actions/checkout@v4
        with:
          path: va-matching-platform

      - name: Checkout shared-canonical-services (sibling)
        uses: actions/checkout@v4
        with:
          repository: forexgrasp-cyber/shared-canonical-services
          path: shared-canonical-services
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install shared services (editable)
        run: |
          pip install -e ${{ env.SHARED_SERVICES_PATH }}

      - name: Install project deps
        working-directory: va-matching-platform
        run: pip install -r requirements.txt

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U postgres && break || sleep 2
          done

      - name: Run Alembic migrations
        working-directory: va-matching-platform
        env:
          VA_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/va_matching_test
        run: |
          pip install alembic
          alembic upgrade head

      - name: Run tests
        working-directory: va-matching-platform
        env:
          VA_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/va_matching_test
        run: pytest -x -q --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: va-matching-platform
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint deps
        working-directory: va-matching-platform
        run: pip install ruff
      - name: Ruff check
        working-directory: va-matching-platform
        run: ruff check .

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: va-matching-platform

      - name: Checkout shared-canonical-services
        uses: actions/checkout@v4
        with:
          repository: forexgrasp-cyber/shared-canonical-services
          path: shared-canonical-services
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        working-directory: va-matching-platform
        run: |
          docker build -t va-matching-platform:sha-${{ github.sha }} \
            --build-arg SHARED_SERVICES_PATH=../shared-canonical-services \
            deployment/

      - name: Smoke test container
        working-directory: va-matching-platform
        run: |
          docker run --rm -d --name smoke \
            -e DATABASE_URL=postgresql+asyncpg://postgres:postgres@host.docker.internal:5432/va_matching_test \
            -e AUTH_DATABASE_URL=sqlite:///tmp/auth_test.db \
            -p 8000:8000 \
            va-matching-platform:sha-${{ github.sha }}
          sleep 10
          curl -f http://localhost:8000/health
          docker stop smoke